name: Godot CI

on:
  push:
    branches:
      - main
      - "rewrite/**"
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          curl --fail --location --retry 3 --output godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64

      - name: Import project
        shell: bash
        run: |
          set -o pipefail
          rm -rf .godot
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import 2>&1 | tee import.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" import.log; then
            echo "Godot import contains an error."
            exit 1
          fi

      - name: Cold start main scene
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 3 2>&1 | tee cold-start.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" cold-start.log; then
            echo "Main scene contains an error."
            exit 1
          fi

      - name: Run core smoke test
        shell: bash
        run: |
          set -o pipefail
          timeout 20s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --scene res://tests/core_smoke.tscn 2>&1 | tee core-smoke.log
          if grep -Eq "SCRIPT ERROR|(^|[[:space:]])ERROR:" core-smoke.log; then
            echo "Core smoke contains an error."
            exit 1
          fi
          grep -q "SKIN_AIM_CORE_SMOKE: PASS" core-smoke.log

  validate-windows:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip" -OutFile "godot.zip"
          Expand-Archive -Path "godot.zip" -DestinationPath "." -Force

      - name: Windows core smoke test
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "Godot_v4.7.2-stable_win64.exe"
          $stdout = Join-Path $PWD "core-smoke-win.out.log"
          $stderr = Join-Path $PWD "core-smoke-win.err.log"

          $process = Start-Process -FilePath $exe -ArgumentList @(
            "--headless",
            "--path", ".",
            "--scene", "res://tests/core_smoke.tscn"
          ) -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr

          $timedOut = -not $process.WaitForExit(30000)
          if ($timedOut) {
            $process.Kill()
            $process.WaitForExit()
          }

          $log = ""
          if (Test-Path $stdout) {
            $log += (Get-Content $stdout -Raw)
          }
          if (Test-Path $stderr) {
            $log += (Get-Content $stderr -Raw)
          }
          Write-Host $log

          if ($timedOut) {
            throw "Windows core smoke test timed out."
          }

          if ($log -match "SCRIPT ERROR|(^|\s)ERROR:") {
            throw "Windows core smoke contains an error."
          }
          if ($log -notmatch "SKIN_AIM_CORE_SMOKE: PASS") {
            throw "Windows core smoke did not complete."
          }
