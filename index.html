<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Skin Aim Trainer — Phase 1</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="app" class="app-shell" aria-label="Aim Trainer">
    <canvas id="game-canvas" aria-label="エイム練習画面"></canvas>

    <section class="hud" aria-live="polite">
      <div class="hud-chip"><span>Score</span><strong id="score-value">0</strong></div>
    </section>

    <div class="crosshair" aria-hidden="true">
      <span class="crosshair-line crosshair-line--horizontal"></span>
      <span class="crosshair-line crosshair-line--vertical"></span>
      <span class="crosshair-dot"></span>
    </div>

    <section id="pause-panel" class="pause-panel" aria-labelledby="pause-title">
      <div class="pause-card">
        <p class="eyebrow">PHASE 1 — CORE AIM PROTOTYPE</p>
        <h1 id="pause-title">クリックして開始</h1>
        <p id="pause-description">画面をクリックするとマウスがAimに固定されます。ESCで一時停止できます。</p>
        <div class="pause-actions">
          <button id="resume-button" class="button button-primary" type="button">Aimを開始</button>
          <button id="restart-button" class="button button-secondary" type="button">最初からやり直す</button>
        </div>
        <dl class="control-list">
          <div><dt>マウス移動</dt><dd>Aim</dd></div>
          <div><dt>左クリック</dt><dd>射撃</dd></div>
          <div><dt>ESC</dt><dd>一時停止</dd></div>
        </dl>
      </div>
    </section>

    <div id="status-toast" class="status-toast" role="status" aria-live="polite"></div>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
